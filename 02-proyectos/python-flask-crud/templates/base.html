<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block titulo %}Instituto{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <header class="barra">
    <a href="{{ url_for('index') }}" class="logo">Gestión de Estudiantes</a>
    <a href="{{ url_for('nuevo') }}" class="btn">+ Nuevo</a>
  </header>
  <main class="contenedor">
    {% with mensajes = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in mensajes %}
        <div class="alerta {{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
